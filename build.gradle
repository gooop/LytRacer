/*
 * Name: build.gradle
 * Description: gradle build config
 * Author(s): Gooop
 * License: MIT
 */


plugins {
    alias(libs.plugins.shadow)
    id 'java'
}

java {
    // Compile with this JDK, independent of the JVM running Gradle.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    // Sources contain '§' color codes; don't depend on the platform default encoding.
    options.encoding = 'UTF-8'

    // Paper API 26.x requires Java 25+.
    options.release = 25
}

group = 'spigot.gradle.project'
version = '26.3-0.2.1.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    compileOnly libs.paper.api
    implementation libs.reflections
}

shadowJar {
    // Make a fat jar so reflections can be accessed at runtime.
    archiveClassifier = ''

    // Utils to be able to get version number at runtime.
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

processResources {
    // Keep plugin.yml's version in sync with the Gradle project version.
    def props = [version: project.version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(props)
    }
}
build.dependsOn shadowJar

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
}
