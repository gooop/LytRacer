pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

// For github actions (successor of the retired 'com.gradle.enterprise' plugin)
plugins {
    id 'com.gradle.develocity' version '4.3.2'
}

develocity {
    buildScan {
        // Only publish build scans from CI, mirroring the old publishAlways()-under-CI behavior.
        publishing.onlyIf { System.getenv('CI') != null }
        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}

// Project name
rootProject.name = 'LytRacer'
